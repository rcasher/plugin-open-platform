<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07131b">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src ws://127.0.0.1:8765; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <title>Speech Coach HUD</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #07131b;
        color: #e8f3f8;
        font: 15px/1.5 -apple-system, system-ui, sans-serif;
      }
      main {
        width: min(420px, 90vw);
        padding: 24px;
        border-radius: 16px;
        background: #0e2028;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset;
      }
      h1 { margin: 0 0 4px; font-size: 18px; }
      p.summary { margin: 0 0 20px; color: #9fb6bf; }
      dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
      dt { color: #9fb6bf; }
      dd { margin: 0; font-weight: 600; }
      .ok { color: #6ee7a6; }
      .warn { color: #f2b35c; }
      #cue {
        margin-top: 20px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #163241;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Speech Coach HUD</h1>
      <p class="summary">Display-only bridge to the on-device evaluator daemon.</p>
      <dl>
        <dt>Bridge</dt>
        <dd id="bridge-status">connecting…</dd>
        <dt>Daemon</dt>
        <dd id="daemon-status">connecting…</dd>
        <dt>Last cue</dt>
        <dd id="cue-time">—</dd>
      </dl>
      <div id="cue">No cue yet.</div>
    </main>
    <script type="module">
      import { createGMPlugin } from './vendor/gm-plugin-web-sdk.esm.js';

      const gm = createGMPlugin();
      const bridgeStatus = document.querySelector('#bridge-status');
      const daemonStatus = document.querySelector('#daemon-status');
      const cueTime = document.querySelector('#cue-time');
      const cueBox = document.querySelector('#cue');

      const DAEMON_URL = 'ws://127.0.0.1:8765';
      const RECONNECT_DELAY_MS = 2000;
      let closeTimer;

      function setDaemonStatus(text, tone) {
        daemonStatus.textContent = text;
        daemonStatus.className = tone ?? '';
      }

      async function showCue(cue, durationMs) {
        clearTimeout(closeTimer);
        cueBox.textContent = cue;
        cueTime.textContent = new Date().toLocaleTimeString();
        try {
          await gm.display.createPage();
          await gm.display.updateText({
            id: 1,
            x: 20,
            y: 20,
            width: 560,
            height: 160,
            border: 1,
            radius: 8,
            text: cue,
          });
        } catch (error) {
          cueBox.textContent = `${cue} (display error: ${error.message})`;
          return;
        }
        closeTimer = setTimeout(() => {
          void gm.display.closePage().catch(() => undefined);
        }, Math.max(500, Number(durationMs) || 2500));
      }

      function connectDaemon() {
        const socket = new WebSocket(DAEMON_URL);
        socket.addEventListener('open', () => setDaemonStatus('connected', 'ok'));
        socket.addEventListener('close', () => {
          setDaemonStatus('disconnected, retrying…', 'warn');
          setTimeout(connectDaemon, RECONNECT_DELAY_MS);
        });
        socket.addEventListener('error', () => socket.close());
        socket.addEventListener('message', (event) => {
          let payload;
          try {
            payload = JSON.parse(event.data);
          } catch {
            return;
          }
          if (typeof payload.cue === 'string' && payload.cue.trim()) {
            void showCue(payload.cue, payload.durationMs);
          }
        });
      }

      async function initialize() {
        try {
          await gm.ready();
          bridgeStatus.textContent = 'connected';
          bridgeStatus.className = 'ok';
        } catch (error) {
          bridgeStatus.textContent = `failed: ${error.message}`;
          bridgeStatus.className = 'warn';
        }
        connectDaemon();
      }

      window.addEventListener('pagehide', () => {
        clearTimeout(closeTimer);
        gm.close();
      });

      void initialize();
    </script>
  </body>
</html>
